# /etc/nginx/sites-available/garrastudios.online
# Site Garra Studios — arquivos estáticos (exportação do Next.js) servidos direto pelo Nginx.
# Sem Node.js, banco ou processo extra. Publicação: deploy/publish.sh (troca atômica do link "current").
#
# Este arquivo NÃO usa default_server: não interfere nos outros sites do mesmo Nginx.
# Certificado: reutiliza o wildcard já existente na VPS (garrastudios.online + *.garrastudios.online),
# renovado pelo certbot via dns-cloudflare. Não é preciso emitir outro.
# Os nomes exatos abaixo têm prioridade sobre a regex de garra-demos (<slug>.garrastudios.online),
# por isso "www" deixa de cair nas demos e passa a redirecionar para o domínio principal.

# HTTP → HTTPS (apex e www)
server {
    listen 80;
    listen [::]:80;
    server_name garrastudios.online www.garrastudios.online;
    return 301 https://garrastudios.online$request_uri;
}

# www → domínio principal (sem www)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.garrastudios.online;

    ssl_certificate     /etc/letsencrypt/live/garrastudios.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garrastudios.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://garrastudios.online$request_uri;
}

# Domínio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name garrastudios.online;

    ssl_certificate     /etc/letsencrypt/live/garrastudios.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garrastudios.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/garrastudios/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

    access_log /var/log/nginx/garrastudios.access.log;
    error_log  /var/log/nginx/garrastudios.error.log warn;

    # Headers de segurança. Atenção: um add_header dentro de um location substitui todos estes,
    # por isso o location de /_next/static/ repete a lista.
    # CSP mínima: restringir script-src quebraria os scripts inline do Next.js.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;

    error_page 404 /404.html;

    # /politica-de-privacidade → politica-de-privacidade.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Arquivos com hash no nome: cache longo.
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Imagens geradas no build sem extensão (ícone Apple e imagem de compartilhamento).
    location = /apple-icon {
        default_type image/png;
        try_files $uri =404;
    }
    location = /opengraph-image {
        default_type image/png;
        try_files $uri =404;
    }

    # O mime.types do Nginx não conhece .webmanifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }
}
